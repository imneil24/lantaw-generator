name: Build and push worker-video image

on:
  push:
    branches: [master]
    paths:
      - worker-video/**
      - .github/workflows/worker-video-image.yml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./worker-video
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lantaw-worker-video:latest
            ghcr.io/${{ github.repository_owner }}/lantaw-worker-video:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
